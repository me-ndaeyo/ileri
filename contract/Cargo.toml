[package]
name = "ileri"
description = "Invoice NFTs on NEAR: issue an invoice, get paid from any chain, sell it early."
version = "0.1.0"
edition = "2024"
resolver = "3"
rust-version = "1.95"
license = "MIT"
# TODO(before deploy): set this to the real GitHub URL. NEP-330 exposes it via
# `contract_source_metadata`, and reproducible-build verification resolves source through it.
repository = "https://github.com/me-ndaeyo/ileri"

[lib]
crate-type = ["cdylib", "rlib"]

# WASM reproducibility, per https://github.com/near/NEPs/blob/master/neps/nep-0330.md
# Generated by `cargo near new` and left intact: the image and its digest are a verified pair.
[package.metadata.near.reproducible_build]
image = "sourcescan/cargo-near:0.22.0-rust-1.99.1"
image_digest = "sha256:c9655eaf7436b90c87ea8b25739f91063032c5c30ba24cfeafe72c142943b5bb"
passed_env = []
container_build_command = [
    "cargo",
    "near",
    "build",
    "non-reproducible-wasm",
    "--locked",
]

[dependencies]
near-sdk = "5.30.1"
# NEP-171 core, NEP-177 metadata, NEP-181 enumeration. NEP-178 approvals are deliberately
# NOT implemented: the marketplace lives inside this contract, so nothing third-party may
# move an invoice.
near-contract-standards = "5.30.1"

[dev-dependencies]
near-sdk = { version = "5.30.1", features = ["unit-testing"] }
# Signs invite fixtures in unit tests, from fixed seeds so tests stay deterministic.
ed25519-dalek = "2.2"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
# Extra safety checks on arithmetic. Non-negotiable for a contract that moves money.
overflow-checks = true

# `cfg(near)` was introduced in near-sdk 5.27.0 and is an expected cfg now.
[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ['cfg(near)']
